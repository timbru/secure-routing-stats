[package]
name = "secure_routing_stats"
version = "0.2.0"
authors = ["Tim Bruijnzeels <tim.bruijnzeels@gmail.com>"]
edition = "2021"

[dependencies]
axum         = "0.7.5"
chrono       = "0.4.42"
clap         = "^2.23"
derive_more  = "^0.13"
intervaltree = "0.2.4"
futures      = "0.1"
serde        = { version = "^1.0", features = ["rc"] }
serde_derive = "^1.0"
serde_json   = "^1.0"
tokio        = { version = "1.38.1", features = ["macros", "rt-multi-thread"] }
tower-http   = { version = "0.5.2", features = ["fs"] }